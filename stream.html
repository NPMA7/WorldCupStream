<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gate Stream - Player</title>
    <link rel="icon" type="image/png" href="img/gatestream_logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <a href="index.html">
            <div class="logo">
                Gate<span>Stream</span>
            </div>
        </a>
    </header>
    
    <main class="container" style="padding-top: 0.5rem; padding-bottom: 0;">
        <div id="stream-view" style="display: none;">
            <div class="stream-container">
                <div class="stream-header">
                    <div class="stream-title" id="match-title">Loading Stream...</div>
                    <a href="index.html" class="back-btn">← Back to Matches</a>
                </div>
                <div class="stream-content-layout">
                    <div class="iframe-wrapper">
                        <iframe id="stream-frame" allow="encrypted-media; autoplay; fullscreen"></iframe>
                    </div>
                    <div class="server-selector-vertical">
                        <div class="server-title">Select Channel</div>
                        <button class="server-btn" onclick="changeServer(0, this)">CH 1</button>
                        <button class="server-btn" onclick="changeServer(1, this)">CH 2</button>
                        <button class="server-btn active" onclick="changeServer(2, this)">CH 3</button>
                        <button class="server-btn" onclick="changeServer(3, this)">CH 4</button>
                        <button class="server-btn" onclick="changeServer(4, this)">CH 5</button>
                        <button class="server-btn" onclick="changeServer(5, this)">CH 6</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="countdown-view" style="display: none;">
            <div class="countdown-container">
                <a href="index.html" class="back-btn" style="margin-bottom: 1rem; display: inline-block;">← Back to Matches</a>
                <div class="countdown-card">
                    <div class="cd-competition" id="cd-comp">Competition Name</div>
                    <div class="cd-teams">
                        <span id="cd-home">Home</span>
                        <div class="cd-vs">VS</div>
                        <span id="cd-away">Away</span>
                    </div>
                    
                    <div class="cd-timer">
                        <div class="cd-box"><div class="cd-num" id="cd-days">00</div><div class="cd-label">DAYS</div></div>
                        <div class="cd-colon">:</div>
                        <div class="cd-box"><div class="cd-num" id="cd-hours">00</div><div class="cd-label">HOURS</div></div>
                        <div class="cd-colon">:</div>
                        <div class="cd-box"><div class="cd-num" id="cd-mins">00</div><div class="cd-label">MINUTES</div></div>
                        <div class="cd-colon">:</div>
                        <div class="cd-box"><div class="cd-num" id="cd-secs">00</div><div class="cd-label">SECONDS</div></div>
                    </div>
                    
                    <div class="cd-text" id="cd-date">Match starts: Loading...</div>
                    
                    <div class="cd-progress-wrapper">
                        <div class="cd-progress-bar">
                            <div class="cd-progress-fill" id="cd-progress"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const matchSlug = urlParams.get('match');
        let matchId = '';

        let cdInterval = null;

        async function initStream() {
            const oldId = urlParams.get('id');
            if (!matchSlug && oldId) {
                matchId = oldId;
                const title = urlParams.get('title') || 'Live Stream';
                const date = urlParams.get('date');
                const comp = urlParams.get('comp');
                const home = urlParams.get('home');
                const away = urlParams.get('away');
                loadPlayer(matchId, title, date, comp, home, away);
                return;
            }

            if (!matchSlug) {
                document.getElementById('stream-view').style.display = 'block';
                document.getElementById('match-title').innerText = "Match not found";
                return;
            }

            try {
                const response = await fetch('https://noneserv.pages.dev/api/matches.json');
                const matches = await response.json();
                
                const matchData = matches.find(m => {
                    const slug = `${m.home.name}-vs-${m.away.name}`.toLowerCase().replace(/[^a-z0-9]+/g, '-');
                    return slug === matchSlug;
                });

                if (matchData) {
                    matchId = matchData.link.split('/').pop().replace('.html', '');
                    const title = `${matchData.home.name} vs ${matchData.away.name}`;
                    loadPlayer(matchId, title, matchData.dateISO, matchData.competition, matchData.home.name, matchData.away.name);
                } else {
                    document.getElementById('stream-view').style.display = 'block';
                    document.getElementById('match-title').innerText = "Match not found";
                }
            } catch (error) {
                console.error("Error fetching match data:", error);
                document.getElementById('stream-view').style.display = 'block';
                document.getElementById('match-title').innerText = "Error loading stream";
            }
        }

        function loadPlayer(id, title, matchDateStr, competition, homeName, awayName) {
            if (!id) return;
            const matchDate = matchDateStr ? new Date(matchDateStr) : new Date(0);
            const now = new Date();

            if (matchDateStr && now < matchDate) {
                document.getElementById('stream-view').style.display = 'none';
                document.getElementById('countdown-view').style.display = 'block';
                
                document.getElementById('cd-comp').innerText = competition || '';
                document.getElementById('cd-home').innerText = homeName || '';
                document.getElementById('cd-away').innerText = awayName || '';
                
                const dateStr = matchDate.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
                const timeStr = matchDate.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
                document.getElementById('cd-date').innerText = `Match starts: ${dateStr} at ${timeStr} WIB`;

                if (cdInterval) clearInterval(cdInterval);
                
                const updateCD = () => {
                    const current = new Date();
                    const diff = matchDate - current;
                    
                    if (diff <= 0) {
                        clearInterval(cdInterval);
                        loadPlayer(id, title, matchDateStr, competition, homeName, awayName);
                        return;
                    }
                    
                    const d = Math.floor(diff / (1000 * 60 * 60 * 24));
                    const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
                    const m = Math.floor((diff / 1000 / 60) % 60);
                    const s = Math.floor((diff / 1000) % 60);
                    
                    document.getElementById('cd-days').innerText = d.toString().padStart(2, '0');
                    document.getElementById('cd-hours').innerText = h.toString().padStart(2, '0');
                    document.getElementById('cd-mins').innerText = m.toString().padStart(2, '0');
                    document.getElementById('cd-secs').innerText = s.toString().padStart(2, '0');
                    
                    const windowMs = 24 * 60 * 60 * 1000; 
                    const elapsed = windowMs - Math.min(diff, windowMs);
                    const pct = Math.max(0, Math.min(100, (elapsed / windowMs) * 100));
                    document.getElementById('cd-progress').style.width = `${pct}%`;
                };
                
                updateCD();
                cdInterval = setInterval(updateCD, 1000);
            } else {
                document.getElementById('countdown-view').style.display = 'none';
                document.getElementById('stream-view').style.display = 'block';
                document.getElementById('match-title').innerText = title || 'Live Stream';
                document.title = title ? `Gate Stream - ${title}` : 'Gate Stream';
                
                document.getElementById('stream-frame').src = `https://noneserv.pages.dev/watch?matchId=${id}&idx=2&autoplay=1&mute=0&muted=false`;
            }
        }

        function changeServer(idx, btn) {
            if (!matchId) return;
            document.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('stream-frame').src = `https://noneserv.pages.dev/watch?matchId=${matchId}&idx=${idx}&autoplay=1&mute=0&muted=false`;
        }

        initStream();
    </script>
</body>
</html>
